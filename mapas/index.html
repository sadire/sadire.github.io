<style>
/* Layout: una columna de trabajo de campo; selector de jornada fijo arriba, tramos como botones grandes, paradas como lista numerada */
:root {
  --paper: #f3f6f8;
  --card: #ffffff;
  --ink: #13212e;
  --muted: #5b6b78;
  --line: #d7dfe5;
  --accent: #0b6e8a;
  --accent-ink: #ffffff;
  --car: #b4531c;
  --done: #2c7a4b;
  --rev: #8a5a00;
  --rev-bg: #fff3d6;
  --done-bg: #e3f3e8;
  --bad: #b3261e;
  --bad-bg: #fde8e6;
  --park: #2563a8;
  --f-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f171e; --card: #17222c; --ink: #e6edf2; --muted: #9aabb8; --line: #2a3a47;
    --accent: #3fb3d3; --accent-ink: #062330; --car: #f08a4b; --done: #5cc98a; --rev: #f2c35a;
    --rev-bg: #3a2f12; --done-bg: #17361f; --bad: #ff8a80; --bad-bg: #3d1a17; --park: #6aa8ea; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f171e; --card: #17222c; --ink: #e6edf2; --muted: #9aabb8; --line: #2a3a47;
  --accent: #3fb3d3; --accent-ink: #062330; --car: #f08a4b; --done: #5cc98a; --rev: #f2c35a;
  --rev-bg: #3a2f12; --done-bg: #17361f; --bad: #ff8a80; --bad-bg: #3d1a17; --park: #6aa8ea; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--card); }
.wrap { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--card); border-bottom: 1px solid var(--line); }
header.bar .wrap { padding-block: 10px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.brand h1 { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: 22px; letter-spacing: .01em; text-wrap: balance; }
.brand .tot { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.days { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.days::-webkit-scrollbar { display: none; }
.chip { flex: 0 0 auto; min-width: 44px; height: 40px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--paper); color: var(--ink);
  font-family: var(--f-display); font-weight: 600; font-size: 18px; cursor: pointer; display: grid; place-items: center; position: relative; font-variant-numeric: tabular-nums; }
.chip small { display: block; font: 600 10px/1 var(--f-body); letter-spacing: .04em; text-transform: uppercase; opacity: .75; margin-top: 1px; }
.chip { line-height: 1; flex-direction: column; }
.chip .dot { position: absolute; top: 5px; right: 5px; width: 6px; height: 6px; border-radius: 50%; background: var(--dc); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.chip.full::after { content: ""; position: absolute; left: 8px; right: 8px; bottom: 5px; height: 2px; background: var(--done); border-radius: 2px; }
.chip:focus-visible, .btn:focus-visible, .tog:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
main .wrap { padding-block: 18px 40px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; }
.dayhead, .stops, .tramos { grid-template-columns: minmax(0, 1fr); }
.dayhead { display: grid; gap: 6px; }
.eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.dayhead h2 { margin: 0; font-family: var(--f-display); font-weight: 600; font-size: 30px; line-height: 1.05; text-wrap: balance; }
.stats { display: flex; flex-wrap: wrap; gap: 6px 16px; color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
.stats b { color: var(--ink); font-weight: 600; }
.progress { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--done); width: 0; transition: width .3s; }
.section-t { font-family: var(--f-display); font-weight: 600; font-size: 19px; margin: 0 0 8px; }
.tramos { display: grid; gap: 8px; }
.tramo { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 10px; background: var(--accent); color: var(--accent-ink); text-decoration: none; font-weight: 600; }
.tramo.full { background: var(--ink); color: var(--paper); padding-block: 16px; }
.tramo .tn { font-family: var(--f-display); font-size: 22px; line-height: 1; min-width: 2.2ch; }
.tramo .tl { flex: 1; min-width: 0; }
.tramo .tl small { display: block; font-weight: 400; opacity: .85; font-size: 13px; }
.tramo .go { font-family: var(--f-display); font-size: 17px; }
.carhop { display: flex; align-items: center; gap: 8px; color: var(--car); font-size: 13px; font-weight: 600; padding-left: 14px; }
.carhop::before { content: ""; width: 18px; border-top: 2px dashed var(--car); }
.hint { color: var(--muted); font-size: 13px; margin: 6px 0 0; }
.map { background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.map svg { display: block; width: 100%; height: auto; }
.stops { list-style: none; margin: 0; padding: 0; display: grid; }
.leg { font-size: 12.5px; color: var(--muted); padding: 2px 0 2px 52px; font-variant-numeric: tabular-nums; }
.leg.car { color: var(--car); font-weight: 600; }
.stop { display: grid; grid-template-columns: 40px 1fr; gap: 12px; padding: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; }
.stop.ok { background: var(--done-bg); }
.stop.rev { background: var(--rev-bg); }
.num { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-display); font-weight: 700; font-size: 19px; color: #fff; background: var(--dc); font-variant-numeric: tabular-nums; }
.stop.ok .num { background: var(--done); }
.body { min-width: 0; display: grid; gap: 8px; }
.nm { font-weight: 600; font-size: 16px; line-height: 1.25; overflow-wrap: anywhere; }
.ad { color: var(--muted); font-size: 13.5px; overflow-wrap: anywhere; }
.ad .from { display: block; font-size: 12.5px; }
.hr { display: grid; gap: 3px; font-size: 13px; font-variant-numeric: tabular-nums; }
.hr .hn { color: var(--muted); font-size: 12.5px; }
.st { justify-self: start; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; border: 1px solid currentColor; }
.st.bad { color: var(--bad); background: var(--bad-bg); }
.st.warn { color: var(--rev); background: var(--rev-bg); }
.st.mute { color: var(--muted); }
.closures { margin: 0; font-size: 13.5px; color: var(--ink); }
.closures b { font-weight: 600; }
.states { display: flex; flex-wrap: wrap; gap: 6px; }
.sb { height: 32px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--muted); font: 600 13px var(--f-body); cursor: pointer; }
.sb:focus-visible, .sync:focus-visible, .nt:focus-visible, .panel input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.sb[aria-pressed="true"] { border-color: transparent; }
.sb-visitado[aria-pressed="true"] { background: var(--done); color: #fff; }
.sb-revisitar[aria-pressed="true"], .sb-cerrado[aria-pressed="true"], .sb-no-localizado[aria-pressed="true"] { background: var(--rev); color: var(--card); }
.nt { width: 100%; min-height: 56px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); font: 14px/1.4 var(--f-body); resize: vertical; }
.sync { justify-self: start; display: inline-flex; align-items: center; gap: 7px; height: 28px; padding: 0 11px; border-radius: 999px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); font: 600 12.5px var(--f-body); cursor: pointer; }
.sync::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.sync.ok::before { background: var(--done); }
.sync.pending::before { background: var(--rev); }
.sync.err::before { background: var(--bad); }
.panel { display: grid; gap: 8px; padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); font-size: 13.5px; }
.panel p { margin: 0; color: var(--muted); }
.panel .row { display: flex; gap: 8px; }
.panel input { flex: 1; min-width: 0; height: 36px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font: 15px var(--f-body); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.park { display: grid; grid-template-columns: 40px 1fr; gap: 12px; padding: 12px; border: 1.5px dashed var(--park); border-radius: 10px; }
.pnum { width: 40px; height: 40px; border-radius: 8px; display: grid; place-items: center; background: var(--park); color: var(--card); font: 700 21px var(--f-display); }
.opt { display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--park); margin-bottom: 2px; }
.acts { display: flex; flex-wrap: wrap; gap: 6px; }
.btn, .tog { height: 36px; padding: 0 12px; border-radius: 8px; font: 600 14px var(--f-body); display: inline-flex; align-items: center; gap: 6px; cursor: pointer; text-decoration: none; }
.btn { background: var(--ink); color: var(--paper); border: 1px solid var(--ink); }
.btn.sec { background: transparent; color: var(--ink); border-color: var(--line); }
.tog { background: transparent; color: var(--muted); border: 1px solid var(--line); }
.tog[aria-pressed="true"].t-ok { background: var(--done); color: #fff; border-color: var(--done); }
.tog[aria-pressed="true"].t-rev { background: var(--rev); color: var(--card); border-color: var(--rev); }
.empty { background: var(--card); border: 1px dashed var(--line); border-radius: 10px; padding: 18px; color: var(--muted); }
.note { color: var(--muted); font-size: 12.5px; }
@media (prefers-reduced-motion: reduce) { .progress i { transition: none; } }
</style>
</head>

<header class="bar">

    <div id="syncpanel" class="panel" hidden>

      </form>

    <nav class="days" id="days" aria-label="Jornadas"></nav>

</header>

function mapSvg(stops, color) {

  const sc = Math.min((W - 2 * P) / Math.max(maxx - minx, 1e-6), (H - 2 * P) / Math.max(maxy - miny, 1e-6));
  const ox = (W - (maxx - minx) * sc) / 2, oy = (H - (maxy - miny) * sc) / 2;
  const pt = i => [ox + (xs[i] - minx) * sc, oy + (ys[i] - miny) * sc];
  let seg = '';
  for (let i = 1; i < stops.length; i++) {
    const [x1, y1] = pt(i - 1), [x2, y2] = pt(i);

  }
  const seen = {};
  const dots = stops.map((s, i) => {
    const [x, y] = pt(i); const k = x.toFixed(0) + ',' + y.toFixed(0);
    const stack = seen[k] = (seen[k] || 0) + 1;
    if (stack > 1) return '';
    const fill = isDone(s.id) ? 'var(--done)' : color;
    return `<g><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="11" fill="${fill}" stroke="var(--card)" stroke-width="2"/><text x="${x.toFixed(1)}" y="${(y + 4.5).toFixed(1)}" text-anchor="middle" font-family="Barlow Condensed, Arial Narrow, sans-serif" font-weight="700" font-size="13" fill="#fff">${s.n}</text></g>`;

      <div><span class="opt">Aparcamiento opcional</span><div class="nm">${esc(o.name)}</div><div class="ad">${esc(o.address)}</div></div>
      <div class="hr"><span>${o.walk_to_min} min andando hasta la parada ${o.before}${o.to_stop > o.before ? ` · vuelta al coche desde la ${o.to_stop}: ${o.walk_back_min} min` : ` · vuelta: ${o.walk_back_min} min`}</span></div>
      <div class="acts"><a class="btn" href="${esc(o.nav)}" target="_blank" rel="noopener">Ir en coche</a>${o.maps ? `<a class="btn sec" href="${esc(o.maps)}" target="_blank" rel="noopener">Ficha</a>` : ''}</div>
    </div></li>`;
}

function stopRow(s, color, dayLabel) {
  const cur = st(s.id), nt = noteOf(s.id);
  const cls = isDone(s.id) ? 'ok' : needsRevisit(s.id) ? 'rev' : '';
  return `<li class="stop ${cls}" style="--dc:${color}">
    <div class="num">${s.n}</div>
    <div class="body">
      <div><div class="nm">${esc(s.name)}</div><div class="ad">${esc(s.addr)} · ${esc(s.cp)}${dayLabel ? `<span class="from">${dayLabel}</span>` : ''}</div></div>
      ${hoursBlock(s)}
      <div class="acts">
        <a class="btn" href="${esc(s.nav)}" target="_blank" rel="noopener">Ir</a>
        <a class="btn sec" href="${esc(s.place)}" target="_blank" rel="noopener">Ficha</a>
      </div>
      <div class="states" role="group" aria-label="Estado de la visita">
        ${ESTADOS.map(v => `<button type="button" class="sb sb-${v.toLowerCase().replace(/ /g, '-')}" data-id="${s.id}" data-v="${v}" aria-pressed="${cur === v}">${v}</button>`).join('')}
        <button type="button" class="sb" data-note="${s.id}" aria-expanded="${!!nt}">Nota${nt ? ' ·' : ''}</button>
      </div>
      <textarea class="nt" id="nt-${s.id}" data-id="${s.id}" rows="2" placeholder="Nota de la visita: con quién hablaste, qué te dijeron…" ${nt ? '' : 'hidden'}>${esc(nt)}</textarea>
    </div></li>`;
}

function tramoLinks(stops) {
  const out = [];
  for (let i = 0; i < stops.length; i += 9) {
    const g = stops.slice(i, i + 10);
    if (g.length < 2 && out.length) break;
    const p = new URLSearchParams({ api: '1', origin: dest(g[0]), destination: dest(g[g.length - 1]), travelmode: 'driving' });
    if (g.length > 2) p.set('waypoints', g.slice(1, -1).map(dest).join('|'));
    out.push({ label: `Paradas ${i + 1}-${i + g.length}`, url: 'https://www.google.com/maps/dir/?' + p.toString().replace(/\+/g, '%20') });
  }
  return out;
}

function renderDay(d) {
  const color = d.color;
  const ok = d.stops.filter(s => isDone(s.id)).length;
  const zone = d.zone.split('  (')[0], cps = (d.zone.match(/\((.*)\)/) || [, ''])[1];
  let tr = '';
  d.tramos.forEach((t, i) => {
    const m = t.label.match(/^(Paradas? [\d-]+)(?:\s+→ coche ([\d.]+) km)?/);
    tr += `<a class="tramo" href="${esc(t.url)}" target="_blank" rel="noopener"><span class="tn">${i + 1}</span><span class="tl">${esc(m[1])}<small>${d.night ? 'En coche' : 'A pie'} en Google Maps</small></span><span class="go">Abrir</span></a>`;
    if (m[2]) tr += `<div class="carhop">Después, mover el coche ${m[2].replace('.', ',')} km</div>`;
  });
  let list = '';
  const parkAt = Object.fromEntries((d.parkings || []).map(o => [o.before, o]));
  d.stops.forEach((s, i) => {
    if (i) list += `<div class="leg${s.mob.startsWith('Coche') ? ' car' : ''}">${legText(s)}</div>`;
    if (parkAt[s.n]) list += parkRow(parkAt[s.n]) + '<div class="leg"></div>';
    list += stopRow(s, color);
  });
  return `
  <section class="dayhead">
    <span class="eyebrow">${d.label ? esc(d.label) + ' · ' : ''}Día ${d.day} de ${DATA.filter(x => !x.night).length} · ${esc(cps)}</span>
    <h2>${esc(zone)}</h2>
    <div class="stats"><span><b>${d.visits}</b> visitas</span><span><b>${String(d.km).replace('.', ',')} km</b> a pie</span><span><b>${d.car}</b> ${d.car === 1 ? 'salto' : 'saltos'} en coche</span><span>~<b>${String(d.hours).replace('.', ',')} h</b></span>${(d.parkings || []).length ? `<span><b>${d.parkings.length}</b> ${d.parkings.length === 1 ? 'aparcamiento opcional' : 'aparcamientos opcionales'}</span>` : ''}<span><b>${ok}</b> hechas</span></div>
    ${d.night ? `<p class="closures"><b>Ruta nocturna.</b> Estos locales abren entre las 18:30 y las 20:00. Empieza hacia las 20:00, en coche.</p>` : ''}
    ${d.closures ? `<p class="closures">${esc(d.closures).replace(/^Cierran:/, '<b>Cierran:</b>').replace('Sin cierres:', '<b>Sin cierres:</b>')}</p>` : ''}
    <div class="progress" aria-hidden="true"><i style="width:${(100 * ok / d.stops.length).toFixed(1)}%"></i></div>
  </section>
  <section><h3 class="section-t">Abrir la ruta en Google Maps</h3>
    <a class="tramo full" href="${esc(d.full)}" target="_blank" rel="noopener"><span class="tn">${d.stops.length}</span><span class="tl">Día completo<small>Las ${d.stops.length} paradas en una sola ruta</small></span><span class="go">Abrir</span></a>
    <p class="hint">La ruta completa carga todas las paradas en Google Maps web. La app del móvil suele cortar a 10; en ese caso usa los tramos.</p></section>
  <section><h3 class="section-t">Por tramos de hasta 10 paradas</h3><div class="tramos">${tr}</div>
    <p class="hint">Si alguna parada no aparece, usa el botón «Ir» de ese local.</p></section>
  <section class="map">${mapSvg(d.stops, color)}</section>
  <section><h3 class="section-t">Paradas en orden</h3><ol class="stops">${list}</ol></section>`;
}

function renderBuffer() {
  const tag = d => ({ day: d.day, dlabel: `Día ${d.day}${d.night ? ' (noche)' : ''}`, color: d.color });
  const rev = DATA.flatMap(d => d.stops.filter(s => needsRevisit(s.id)).map(s => ({ ...s, ...tag(d) })));
  const pend = DATA.flatMap(d => d.stops.filter(s => st(s.id) === 'Pendiente').map(s => ({ ...s, ...tag(d) })));
  let html = `<section class="dayhead"><span class="eyebrow">${BUF.label ? esc(BUF.label) + ' · ' : ''}Día ${BUFKEY} · Colchón</span><h2>Revisitas</h2>
    <div class="stats"><span><b>${rev.length}</b> por revisitar</span><span><b>${pend.length}</b> sin marcar en días anteriores</span></div></section>`;
  if (!rev.length) {
    html += `<div class="empty">Aquí aparecerán los locales que marques como «Revisitar», «Cerrado» o «No localizado» durante los días 1 a 9. Para cada uno tendrás el botón «Ir», su nota y un enlace con la ruta completa.</div>`;
  } else {
    const links = tramoLinks(rev);
    const full = 'https://www.google.com/maps/dir/' + rev.map(s => encodeURIComponent(dest(s))).join('/');
    html += `<section><h3 class="section-t">Ruta de revisitas en Google Maps</h3><div class="tramos"><a class="tramo full" href="${esc(full)}" target="_blank" rel="noopener"><span class="tn">${rev.length}</span><span class="tl">Todas las revisitas<small>Una sola ruta, en Google Maps web</small></span><span class="go">Abrir</span></a>${links.length > 1 ? links.map((t, i) => `<a class="tramo" href="${esc(t.url)}" target="_blank" rel="noopener"><span class="tn">${i + 1}</span><span class="tl">${t.label}<small>En coche, en el orden de los días</small></span><span class="go">Abrir</span></a>`).join('') : ''}</div></section>
      <section class="map">${mapSvg(rev.map((s, i) => ({ ...s, n: i + 1 })), '#8a5a00')}</section>
      <section><h3 class="section-t">Locales a revisitar</h3><ol class="stops">${rev.map((s, i) => stopRow({ ...s, n: i + 1 }, s.color, `${s.dlabel}, parada ${s.n}`)).join('<div class="leg"></div>')}</ol></section>`;
  }
  html += `<p class="note">${SYNC_ON ? 'Los estados y notas se guardan en este dispositivo y en tu hoja de Google.' : 'Los estados y notas se guardan solo en este navegador y en este dispositivo.'}</p>`;
  return html;
}

function rerender() { const y = window.scrollY; render(); window.scrollTo(0, y); }

function render() {
  renderChips();
  showSync();
  const v = document.getElementById('view');
  v.innerHTML = day === BUFKEY ? renderBuffer() : renderDay(DATA.find(d => d.key === day));
  v.querySelectorAll('.sb[data-v]').forEach(b => b.addEventListener('click', () => {
    const id = b.dataset.id, val = b.dataset.v;
    setVisit(id, { estado: st(id) === val ? 'Pendiente' : val });   // pulsar el estado activo lo quita
    rerender();
  }));
  v.querySelectorAll('[data-note]').forEach(b => b.addEventListener('click', () => {
    const t = document.getElementById('nt-' + b.dataset.note);
    t.hidden = !t.hidden; b.setAttribute('aria-expanded', String(!t.hidden));
    if (!t.hidden) t.focus();
  }));
  v.querySelectorAll('textarea.nt').forEach(t => {
    let tm;
    const commit = () => { clearTimeout(tm); if (t.value !== noteOf(t.dataset.id)) setVisit(t.dataset.id, { nota: t.value }); };
    t.addEventListener('input', () => { clearTimeout(tm); tm = setTimeout(commit, 900); });
    t.addEventListener('blur', commit);
  });
}

// panel de conexion con la hoja
document.getElementById('sync').addEventListener('click', () => {
  const p = document.getElementById('syncpanel'); p.hidden = !p.hidden;
  if (!p.hidden) document.getElementById('pin-in').focus();
});
document.getElementById('pin-form').addEventListener('submit', ev => {
  ev.preventDefault();
  pin = document.getElementById('pin-in').value.trim();
  try { localStorage.setItem(PKEY, pin); } catch (e) {}
  syncState = 'idle'; showSync(); pull();
  document.getElementById('syncpanel').hidden = true;
});
window.addEventListener('online', flush);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') pull(); });
setInterval(() => { if (Object.keys(outbox).length) flush(); }, 30000);

render();
pull();
</script>
</body>
</html>
